apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyzer-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: analyzer-service
spec:
  replicas: {{ .Values.analyzer.replicaCount }}
  selector:
    matchLabels:
      app: analyzer-service
  template:
    metadata:
      labels:
        app: analyzer-service
    spec:
      containers:
      - name: analyzer
        image: "{{ .Values.analyzer.image.repository }}:{{ .Values.analyzer.image.tag }}"
        imagePullPolicy: {{ .Values.analyzer.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.analyzer.service.port }}
          name: http
        env:
        - name: PYTHONUNBUFFERED
          value: {{ .Values.global.pythonUnbuffered | quote }}
        - name: OLLAMA_BASE_URL
          value: {{ .Values.infrastructure.ollama.baseUrl | quote }}
        - name: LLM_MODEL
          value: {{ .Values.infrastructure.ollama.model | quote }}
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: {{ .Values.infrastructure.kafka.bootstrapServers | quote }}
        resources:
          {{- toYaml .Values.analyzer.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: analyzer-service
  namespace: {{ .Values.global.namespace }}
spec:
  type: {{ .Values.analyzer.service.type }}
  ports:
  - port: {{ .Values.analyzer.service.port }}
    targetPort: {{ .Values.analyzer.service.port }}
    name: http
  selector:
    app: analyzer-service


