apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: ingestion-service
spec:
  replicas: {{ .Values.ingestion.replicaCount }}
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      containers:
      - name: ingestion
        image: "{{ .Values.ingestion.image.repository }}:{{ .Values.ingestion.image.tag }}"
        imagePullPolicy: {{ .Values.ingestion.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.ingestion.service.port }}
          name: http
        env:
        - name: PYTHONUNBUFFERED
          value: {{ .Values.global.pythonUnbuffered | quote }}
        - name: REDIS_HOST
          value: {{ .Values.infrastructure.valkey.host | quote }}
        - name: REDIS_PORT
          value: {{ .Values.infrastructure.valkey.port | quote }}
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: {{ .Values.infrastructure.kafka.bootstrapServers | quote }}
        resources:
          {{- toYaml .Values.ingestion.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: {{ .Values.global.namespace }}
spec:
  type: {{ .Values.ingestion.service.type }}
  ports:
  - port: {{ .Values.ingestion.service.port }}
    targetPort: {{ .Values.ingestion.service.port }}
    name: http
  selector:
    app: ingestion-service